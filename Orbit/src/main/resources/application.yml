server:
  port: 8080

spring:
  application:
    name: navigator-nest

  # === H2 資料庫設定（文件模式，資料會持久化）===
  datasource:
    # 檔案會落在專案根目錄：data/navigator-nest/navigator_nest.mv.db
    url: jdbc:h2:file:./data/navigator-nest/navigator_nest;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # update：啟動時更新 schema，不會 drop 既有資料
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # 讓 data.sql 在 Hibernate 建完表之後再執行
    defer-datasource-initialization: true

  sql:
    init:
      # always：每次啟動執行 data.sql（已改為 MERGE，不會清掉 AI 新存的任務）
      mode: always
      encoding: UTF-8

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        # 本機開發允許 Console；若只本機開可改 false
        web-allow-others: true
        trace: false

# === JWT 設定 ===
# secret 需為 Base64 編碼字串（JwtTokenProvider 會 decode）
jwt:
  # Base64 of a long HS secret (>= 64 bytes after decode)
  secret: "cGxlYXNlLWNoYW5nZS10aGlzLWRldi1zZWNyZXQtcGxlYXNlLWNoYW5nZS10aGlzLWRldi1zZWNyZXQtMDEyMzQ1Njc4OWFi"
  expiration: 86400000

# === 本地 LLM（OpenAI 相容 API：Ollama / LM Studio）===
# Ollama 預設：http://localhost:11434/v1
# LM Studio 常見：http://localhost:1234/v1
ai:
  base-url: http://localhost:11434/v1
  model: thewindmom/hermes-3-llama-3.1-8b:latest
  # Ollama 通常不需要；LM Studio / 其他服務若有要求可填
  api-key:

# === Orbit — AI Job Execution Console：Job 推論用 Ollama 設定 ===
# ollama.model：Job 未指定 modelName 時的降級預設模型
# 前端傳入 modelName > ollama.model 配置 > llama3:8b 硬編碼預設
ollama:
  base-url: http://localhost:11434
  model: llama3:8b
