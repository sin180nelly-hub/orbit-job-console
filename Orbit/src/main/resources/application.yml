server:
  port: 8080

spring:
  application:
    name: navigator-nest

  # === H2 鞈?摨怨身摰??辣璅∪?嚗???????===
  datasource:
    # 瑼???典?獢?桅?嚗ata/navigator-nest/navigator_nest.mv.db
    url: jdbc:h2:file:./data/navigator-nest/navigator_nest;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # update嚗????湔 schema嚗???drop ?Ｘ?鞈?
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # 霈?data.sql ??Hibernate 撱箏?銵其?敺??瑁?
    defer-datasource-initialization: true

  sql:
    init:
      # always嚗?甈∪??銵?data.sql嚗歇?寧 MERGE嚗?????AI ?啣??遙??
      mode: always
      encoding: UTF-8

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        # ?祆???迂 Console嚗?芣璈??舀 false
        web-allow-others: true
        trace: false

# === JWT 閮剖? ===
# secret ???Base64 蝺函Ⅳ摮葡嚗wtTokenProvider ??decode嚗?jwt:
  # Base64 of a long HS secret (>= 64 bytes after decode)
    secret: "please-change-this-dev-secret-please-change-this-dev-secret-0123456789ab"
  expiration: 86400000

