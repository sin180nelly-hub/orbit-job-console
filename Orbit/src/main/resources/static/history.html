<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit AI 控制台 | 歷史紀錄與編輯</title>
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    /* Orbit AI 控制台 — history.html 專屬微調樣式（其餘沿用 app.css） */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .filter-bar input[type="text"],
    .filter-bar select {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(2, 6, 23, 0.75);
      color: var(--text, #e2e8f0);
      outline: none;
    }
    .filter-bar input[type="text"] { flex: 1; min-width: 220px; }

    table.history { width: 100%; border-collapse: collapse; }
    table.history th, table.history td {
      text-align: left;
      padding: 6px;
      vertical-align: top;
    }
    .detail-row td { background: rgba(34, 211, 238, 0.05); }
    .detail-box {
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
      max-width: 100%;
      margin: 4px 0 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(2, 6, 23, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }
    .editor-panel textarea {
      width: 100%;
      min-height: 140px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(2, 6, 23, 0.75);
      color: var(--text, #e2e8f0);
      outline: none;
      resize: vertical;
    }
    .editor-panel input[type="text"], .editor-panel select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(2, 6, 23, 0.75);
      color: var(--text, #e2e8f0);
      outline: none;
    }
  </style>
</head>
<body>
  <!-- 沿用 nest ambient 裝飾 -->
  <div class="nest-ambient" aria-hidden="true">
    <div class="glow-base"></div>
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="orb orb-d"></div>
    <div class="orb orb-e"></div>
  </div>

  <div class="nav-shell">
    <nav class="app-nav">
      <a class="brand" href="/index.html">
        <span class="brand-mark">🛰️</span>
        <span>Orbit AI 控制台</span>
      </a>
      <div class="nav-links">
        <a href="/index.html">工作控制台</a>
        <a href="/history.html" class="active">歷史紀錄與編輯</a>
      </div>
      <div class="nav-user">
        <span id="healthStatus" style="margin-right:10px; font-size:13px;">⚪ 檢查中…</span>
        <span class="user-name">已登入 <strong id="navUsername">—</strong></span>
        <button type="button" class="btn btn-ghost" id="logoutBtn">退出</button>
      </div>
    </nav>
  </div>

  <main class="app-main">
    <header class="page-header">
      <h1><span class="title-accent">歷史紀錄</span> 與 Prompt 編輯</h1>
      <p>檢視過往生成紀錄，載入舊任務並以新版本重新發送推論。輕量級 LLM 推論任務調度與排程控制台。</p>
    </header>

    <!-- A. 歷史紀錄搜尋與篩選列 -->
    <section class="card">
      <div class="card-title-row">
        <p class="card-title">搜尋與篩選</p>
      </div>
      <div class="filter-bar">
        <input type="text" id="searchKeyword" placeholder="搜尋任務名稱或 Prompt 關鍵字…" oninput="renderHistory()" />
        <select id="filterModel" onchange="renderHistory()">
          <option value="">全部模型</option>
          <option value="llama3:8b">Llama 3 (8B)</option>
          <option value="__custom__">自訂</option>
        </select>
        <select id="filterStatus" onchange="renderHistory()">
          <option value="">全部狀態</option>
          <option value="SUCCESS">SUCCESS</option>
          <option value="FAILED">FAILED</option>
          <option value="PENDING">PENDING</option>
          <option value="RUNNING">RUNNING</option>
        </select>
        <button type="button" class="btn btn-secondary btn-sm" onclick="loadHistory()">重新整理</button>
      </div>
    </section>

    <!-- B. 歷史任務詳細列表 -->
    <section class="card">
      <div class="card-title-row">
        <p class="card-title">歷史任務列表</p>
      </div>
      <table class="history">
        <thead>
          <tr>
            <th>ID</th>
            <th>任務名稱</th>
            <th>推論模型</th>
            <th>執行狀態</th>
            <th>耗時 (ms)</th>
            <th>建立時間</th>
            <th>操作方式</th>
          </tr>
        </thead>
        <tbody id="historyTableBody">
          <tr><td colspan="7" class="muted">載入中…</td></tr>
        </tbody>
      </table>
    </section>

    <!-- C. Prompt & 參數編輯畫廊 -->
    <section class="card editor-panel" id="editorPanel" style="display:none;">
      <div class="card-title-row">
        <p class="card-title">Prompt 編輯區<span id="editorSourceTag" class="muted" style="margin-left:8px; font-size:12px;"></span></p>
      </div>
      <label for="editJobName" style="display:block; margin-bottom:5px;">任務名稱：</label>
      <input type="text" id="editJobName" />

      <label for="editModelName" style="display:block; margin:10px 0 5px;">型號名稱：</label>
      <select id="editModelName">
        <option value="llama3:8b">Llama 3 (8B)</option>
        <option value="llama3.2">llama3.2</option>
        <option value="mistral">mistral</option>
        <option value="gemma2">gemma2</option>
        <option value="qwen2.5">qwen2.5</option>
      </select>

      <label for="editPrompt" style="display:block; margin:10px 0 5px;">Prompt（可自由優化修改）：</label>
      <textarea id="editPrompt" placeholder="修改後的 Prompt 內容…"></textarea>

      <p class="voice-hint" id="editorHint"></p>
      <div class="btn-row" style="margin-top:10px;">
        <!-- 以新版本重新發送任務：POST /api/jobs 建立新 Job 並執行 -->
        <button type="button" class="btn btn-primary" id="btnRerun">以新版本重新發送任務 (Re-run with New Version)</button>
        <button type="button" class="btn btn-ghost" id="btnCloseEditor">關閉編輯區</button>
      </div>
    </section>
  </main>

  <script>
    /* ═══════════════════════════════════════════════════════
       Orbit AI 控制台 — 歷史紀錄與 Prompt 編輯頁
       API：
         GET  /api/jobs  載入歷史紀錄
         POST /api/jobs  以新版本建立並執行任務
       ═══════════════════════════════════════════════════════ */
    const TOKEN_KEY = 'nn_token';
    const USER_KEY = 'nn_username';
    const DEFAULT_MODEL = 'llama3:8b';

    let allJobs = [];           // 快取的完整紀錄
    let expandedIds = new Set(); // 已展開詳情的列
    let editingSourceId = null;  // 目前編輯中的來源 Job ID

    function getToken() { return localStorage.getItem(TOKEN_KEY); }

    function requireAuth() {
      const token = getToken();
      const username = localStorage.getItem(USER_KEY);
      if (!token || !username) { location.href = '/login.html'; return false; }
      document.getElementById('navUsername').textContent = username;
      return true;
    }

    function authHeaders(extra = {}) {
      const headers = { ...extra };
      const token = getToken();
      if (token) headers['Authorization'] = 'Bearer ' + token;
      return headers;
    }

    function logout() {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
      location.href = '/login.html';
    }

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function statusBadge(status) {
      const s = String(status || '').toUpperCase();
      let cls;
      switch (s) {
        case 'SUCCESS': cls = 'badge-success'; break;
        case 'FAILED':  cls = 'badge-failed';  break;
        case 'RUNNING': cls = 'badge-running'; break;
        default:        cls = 'badge-pending'; break;
      }
      return '<span class="' + cls + '">' + escapeHtml(s) + '</span>';
    }

    function fmtTime(iso) {
      if (!iso) return '—';
      try { return new Date(iso).toLocaleString('zh-TW', { hour12: false }); }
      catch (e) { return iso; }
    }

    function setEditorHint(msg, kind) {
      const el = document.getElementById('editorHint');
      el.textContent = msg || '';
      el.classList.remove('is-error', 'is-active');
      if (kind === 'error') el.classList.add('is-error');
      if (kind === 'active') el.classList.add('is-active');
    }

    /* ── GET /api/jobs：載入全部歷史紀錄 ── */
    async function loadHistory() {
      const tbody = document.getElementById('historyTableBody');
      try {
        const resp = await fetch('/api/jobs', { method: 'GET', headers: authHeaders() });
        if (resp.status === 401 || resp.status === 403) {
          tbody.innerHTML = '<tr><td colspan="7" class="err">未授權，請重新登入</td></tr>';
          setTimeout(logout, 800);
          return;
        }
        if (!resp.ok) {
          tbody.innerHTML = '<tr><td colspan="7" class="err">載入失敗：HTTP ' + resp.status + '</td></tr>';
          return;
        }
        allJobs = await resp.json();
        renderHistory();
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="7" class="err">載入失敗：' + escapeHtml(e.message) + '</td></tr>';
      }
    }

    /* ── 篩選 + 渲染列表 ── */
    function getFilteredJobs() {
      const kw = document.getElementById('searchKeyword').value.trim().toLowerCase();
      const modelFilter = document.getElementById('filterModel').value;
      const statusFilter = document.getElementById('filterStatus').value.toUpperCase();

      return allJobs.filter(function (j) {
        // 關鍵字：任務名稱或 Prompt
        if (kw && !(String(j.jobName || '').toLowerCase().includes(kw)
                 || String(j.prompt || '').toLowerCase().includes(kw))) return false;
        // 模型篩選；「自訂」= 不在預設清單內的模型
        if (modelFilter === '__custom__') {
          const known = ['llama3:8b', 'llama3.2', 'mistral', 'gemma2', 'qwen2.5'];
          if (known.includes(String(j.modelName || '').toLowerCase())) return false;
        } else if (modelFilter && String(j.modelName || '') !== modelFilter) {
          return false;
        }
        // 狀態篩選
        if (statusFilter && String(j.status || '').toUpperCase() !== statusFilter) return false;
        return true;
      });
    }

    function renderHistory() {
      const tbody = document.getElementById('historyTableBody');
      const jobs = getFilteredJobs();

      if (!Array.isArray(jobs) || jobs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="muted" style="padding:8px;">沒有符合條件的紀錄。</td></tr>';
        return;
      }

      tbody.innerHTML = jobs.map(function (j) {
        let rows = '<tr>'
          + '<td>' + escapeHtml(j.id) + '</td>'
          + '<td>' + escapeHtml(j.jobName) + '</td>'
          + '<td>' + escapeHtml(j.modelName || DEFAULT_MODEL) + '</td>'
          + '<td>' + statusBadge(j.status) + '</td>'
          + '<td>' + (j.executionTimeMs == null ? '—' : escapeHtml(j.executionTimeMs)) + '</td>'
          + '<td>' + escapeHtml(fmtTime(j.createdAt)) + '</td>'
          + '<td>'
          +   '<button type="button" class="btn btn-secondary btn-sm" onclick="toggleDetail(' + j.id + ')">👁️ 檢視完整紀錄</button>'
          +   ' <button type="button" class="btn btn-primary btn-sm" onclick="loadIntoEditor(' + j.id + ')">✏️ 載入並編輯</button>'
          + '</td>'
          + '</tr>';

        // 展開詳情列
        if (expandedIds.has(j.id)) {
          rows += '<tr class="detail-row"><td colspan="7">'
            + '<p><strong>提示詞 (Prompt)：</strong></p>'
            + '<pre class="detail-box">' + escapeHtml(j.prompt || '（無）') + '</pre>'
            + '<p><strong>生成結果 (Result)：</strong></p>'
            + '<pre class="detail-box">' + escapeHtml(j.result || '（尚未執行）') + '</pre>'
            + '</td></tr>';
        }
        return rows;
      }).join('');
    }

    /* ── 👁️ 展開／收起完整紀錄 ── */
    function toggleDetail(id) {
      if (expandedIds.has(id)) expandedIds.delete(id);
      else expandedIds.add(id);
      renderHistory();
    }

    /* ── ✏️ 載入該筆紀錄至 Prompt 編輯區 ── */
    function loadIntoEditor(id) {
      const job = allJobs.find(function (j) { return j.id === id; });
      if (!job) { setEditorHint('找不到任務 #' + id, 'error'); return; }

      editingSourceId = id;
      document.getElementById('editJobName').value = job.jobName || '';
      document.getElementById('editPrompt').value = job.prompt || '';
      // 若來源模型不在下拉選單中，動態補一個選項（保留自訂模型）
      const sel = document.getElementById('editModelName');
      const m = job.modelName || DEFAULT_MODEL;
      if (![...sel.options].some(function (o) { return o.value === m; })) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m + '（自訂）';
        sel.appendChild(opt);
      }
      sel.value = m;

      document.getElementById('editorSourceTag').textContent = '（來源：任務 #' + id + '）';
      setEditorHint('');
      const panel = document.getElementById('editorPanel');
      panel.style.display = 'block';
      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      document.getElementById('editPrompt').focus();
    }

    /* ── 以新版本重新發送任務：POST /api/jobs → execute ── */
    async function rerunNewVersion() {
      const jobName = document.getElementById('editJobName').value.trim();
      const prompt = document.getElementById('editPrompt').value.trim();
      const modelName = document.getElementById('editModelName').value;

      if (!jobName) { setEditorHint('請輸入任務名稱', 'error'); return; }
      if (!prompt) { setEditorHint('請輸入 Prompt 內容', 'error'); return; }

      const btn = document.getElementById('btnRerun');
      btn.disabled = true;
      setEditorHint('建立新版任務中…', 'active');

      try {
        const resp = await fetch('/api/jobs', {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ jobName: jobName, prompt: prompt, modelName: modelName })
        });

        if (resp.status === 401 || resp.status === 403) {
          setEditorHint('未授權，請重新登入', 'error');
          setTimeout(logout, 800);
          return;
        }

        const data = await resp.json().catch(function () { return {}; });
        if (!resp.ok) {
          setEditorHint(data.message || ('建立失敗：HTTP ' + resp.status), 'error');
          return;
        }

        // 建立 → 觸發執行
        await fetch('/api/jobs/' + data.id + '/execute', {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' })
        });

        setEditorHint('✅ 新版任務 #' + data.id + ' 已建立並執行完成！可展開檢視結果，或到工作控制台查看。');
        loadHistory(); // 刷新列表（新版本會出現在最上方）
      } catch (e) {
        setEditorHint('發送失敗：' + e.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    /* ── Init ── */
    if (requireAuth()) {
      document.getElementById('logoutBtn').addEventListener('click', logout);
      document.getElementById('btnRerun').addEventListener('click', rerunNewVersion);
      document.getElementById('btnCloseEditor').addEventListener('click', function () {
        document.getElementById('editorPanel').style.display = 'none';
        editingSourceId = null;
      });
      loadHistory();
      initHealthCheck();
      loadModelOptions('editModelName'); // 動態模型選單（Prompt 編輯區）
    }

    /* ── 動態模型選單：GET /api/models → 填充指定 <select> ── */
    async function loadModelOptions(selectId) {
      const sel = document.getElementById(selectId);
      if (!sel) return;
      const current = sel.value;
      try {
        const resp = await fetch('/api/models', { method: 'GET' });
        const data = await resp.json().catch(function () { return {}; });
        const models = Array.isArray(data.models) ? data.models : [];
        if (models.length === 0) return;

        sel.innerHTML = '';
        let found = false;
        models.forEach(function (m) {
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m === 'llama3:8b' ? 'Llama 3 (8B)' : m;
          sel.appendChild(opt);
          if (current && m === current) found = true;
        });
        if (current && !found) {
          const opt = document.createElement('option');
          opt.value = current;
          opt.textContent = current + '（自訂）';
          sel.appendChild(opt);
          sel.value = current;
        }
      } catch (e) {
        console.warn('載入模型清單失敗，保留預設選項', e);
      }
    }

    /* ── 服務健康檢查：GET /api/health → 綠燈/紅燈 ── */
    function initHealthCheck() {
      checkHealth();
      setInterval(checkHealth, 30000); // 每 30 秒自動巡檢
    }

    async function checkHealth() {
      const el = document.getElementById('healthStatus');
      try {
        const resp = await fetch('/api/health', { method: 'GET' });
        const data = await resp.json().catch(function () { return {}; });
        if (resp.ok && data.ollama === 'UP') {
          el.textContent = '🟢 Ollama Online';
          el.style.color = '#86efac';
        } else {
          el.textContent = '🔴 Ollama Offline';
          el.style.color = '#fca5a5';
        }
      } catch (e) {
        el.textContent = '🔴 Ollama Offline';
        el.style.color = '#fca5a5';
      }
    }
  </script>
</body>
</html>
